<header><a class="logo" href="#" aria-label="返回首页">vibe<span>✳</span></a><span class="navlabel">人格实验室 / PERSONALITY LAB</span><button class="textbtn" id="about">这是什么？</button></header>
<main id="app"></main><footer><span>BE YOUR OWN KIND.</span><span>原创性格探索 · 非官方 MBTI 测评</span></footer>
<dialog id="info"><button class="close" aria-label="关闭">×</button><p class="eyebrow">A LITTLE CONTEXT</p><h2>是探索，<br>也是新的对话。</h2><p>这是一份基于四组性格偏好的原创问卷，用于日常自我探索，未经心理测量学验证。它不是官方 MBTI 测评，也不用于诊断或判断能力。</p><p>结果反映你这次的回答。接近中间的维度没有明显偏向，情境和状态也可能影响回答。你比任何四个字母都丰富。</p><p>答案只保存在当前浏览器，不上传服务器。你可以随时清除；分享卡片不包含具体答案。</p><button class="button dark" id="clear">清除本机记录</button></dialog><div id="toast" role="status"></div><script>
const groups=[
['EI',[
['聚会结束后，和大家聊天通常让我更有精神。',1],['遇到新想法，我习惯先自己想清楚再分享。',-1],['到了陌生的活动现场，我愿意主动认识人。',1],['连续几天社交后，我很想留一段独处时间。',-1],['小组讨论时，我常常边说边整理思路。',1],['休息日，我更期待安静地做自己的事。',-1],['开心的事发生时，我通常马上找人分享。',1],['比起热闹的大群，我偏爱少数人的深入交流。',-1]]],
['SN',[
['学习新东西时，我希望先看到具体例子。',1],['看完一个故事，我常会联想到它背后的含义。',-1],['做任务时，我更信任已经验证过的方法。',1],['讨论未来的各种可能性，比讨论眼前细节更吸引我。',-1],['向别人描述事情时，我习惯交代具体细节。',1],['遇到问题，我常想试试没有用过的新路径。',-1],['收到任务时，我会先确认现有事实和条件。',1],['看一件作品时，我更关注它传递的概念。',-1]]],
['TF',[
['做困难决定时，我通常先比较逻辑和利弊。',1],['给朋友提意见时，我会先照顾对方的感受。',-1],['讨论有分歧时，我更想把判断标准说清楚。',1],['分配任务时，我会优先考虑每个人的处境。',-1],['评价一个方案时，一致的原则对我很重要。',1],['即使方案很高效，我也会在意它是否符合我的价值观。',-1],['朋友问我的看法时，我倾向先客观分析问题。',1],['团队做决定时，我很重视大家是否感到被理解。',-1]]],
['JP',[
['开始旅行前，我喜欢先安排主要行程。',1],['一个没有计划的周末，也能让我觉得很自在。',-1],['面对截止日期，我习惯提前分配进度。',1],['如果出现有趣的新机会，我愿意临时改计划。',-1],['把待办事项逐一完成，会让我感到安心。',1],['做创作时，我更喜欢边尝试边决定方向。',-1],['事情确定下来后，我通常觉得更轻松。',1],['在下决定前，我喜欢尽量保留可调整的空间。',-1]]]
];
// Interleave dimensions to avoid blocks priming later responses.
const questions=Array.from({length:8},(_,i)=>groups.map(([dim,qs])=>({dim,text:qs[i][0],direction:qs[i][1]}))).flat();
const KEY='vibe-lab-v1',app=document.querySelector('#app');let answers=Array(32).fill(null),index=0,result=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.answers)&&s.answers.length===32&&s.answers.every(v=>v===null||(Number.isInteger(v)&&v>=-2&&v<=2))){answers=s.answers;index=Number.isInteger(s.index)?Math.min(31,Math.max(0,s.index)):0;}}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({answers,index}));}catch{}}
function notify(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),3000);}
const count=()=>answers.filter(x=>x!==null).length;
function home(){app.innerHTML=`<div class="hero enter"><section><p class="eyebrow">FIND YOUR INNER FREQUENCY</p><h1>你的个性，<br>不止一种<em>可能。</em></h1><p class="intro">有时是人群里的发光体，有时是自己的小宇宙。<br>用 32 个日常瞬间，发现此刻更接近你的性格偏好。</p><div class="actions"><button class="button dark" id="start">${count()&&count()<32?'继续探索 · '+count()+'/32':'开启我的探索'}</button><button class="textbtn" id="what">先了解一下</button>${count()===32?'<button class="textbtn" id="last">查看上次结果</button>':''}</div><p class="micro">约 5–8 分钟 · 无需登录 · 答案仅保存在本机</p></section><div class="art" aria-label="带着环形轨道的紫色笑脸星球插画"><span class="caption">YOU ARE A WHOLE UNIVERSE.</span><span class="artnote">✳ VIBE LAB</span><div class="orb"><div class="smile"></div></div><div class="orbit"></div><span class="star">✳</span><span class="tag">100% 做自己</span><span class="tag right">今天，你是什么频率？</span></div></div><div class="ticker">LESS LABELS. MORE YOU.　✳　每一种个性，都有自己的光。　✳　STAY CURIOUS.</div><div class="preview"><section class="feature"><small>REAL LIFE</small><h3>从生活里找到自己</h3><p>聚会、学习、旅行和小组合作。没有标准答案，选更像你的那个。</p></section><section class="feature"><small>YOUR SPECTRUM</small><h3>看见倾向，也看见变化</h3><p>不只给你四个字母。靠近中间的回答，也值得被认真对待。</p></section><section class="feature"><small>TAKE IT WITH YOU</small><h3>把灵感带回日常</h3><p>收下学习与沟通建议，再保存一张属于你的性格卡片。</p></section></div>`;document.querySelector('#start').onclick=()=>{if(count()===32){answers.fill(null);index=0;}else{index=Math.max(0,answers.findIndex(x=>x===null));}quiz();};document.querySelector('#what').onclick=()=>document.querySelector('#info').showModal();if(document.querySelector('#last'))document.querySelector('#last').onclick=showResult;}
function quiz(){const q=questions[index];app.innerHTML=`<div class="quiz enter"><div class="progressmeta"><span>认识自己，没有标准答案</span><span>${index+1} / 32</span></div><div class="track" role="progressbar" aria-label="已完成题目" aria-valuemin="0" aria-valuemax="32" aria-valuenow="${count()}"><div class="fill" style="width:${count()/32*100}%"></div></div><p class="eyebrow">FOLLOW YOUR FIRST INSTINCT</p><h2 tabindex="-1">${q.text}</h2><p class="hint">按你平时自然的状态选择，不必选择“理想中的自己”。</p><div class="options" role="radiogroup" aria-label="选择符合程度">${['非常符合','比较符合','介于两者之间','不太符合','完全不符合'].map((t,i)=>`<button class="option ${answers[index]===2-i?'selected':''}" role="radio" aria-checked="${answers[index]===2-i}" data-value="${2-i}"><span class="radio"></span>${t}</button>`).join('')}</div><div class="quiznav"><button class="button" id="prev">${index?'上一题':'返回首页'}</button><button class="button dark" id="next" ${answers[index]===null?'disabled':''}>${index===31?'查看我的结果':'下一题'}</button></div><p class="micro">已自动保存已选答案 · 可随时返回修改</p></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[index]=Number(b.dataset.value);persist();document.querySelectorAll('.option').forEach(el=>{const checked=el===b;el.classList.toggle('selected',checked);el.setAttribute('aria-checked',checked);});document.querySelector('#next').disabled=false;document.querySelector('.fill').style.width=count()/32*100+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',count());});document.querySelector('#prev').onclick=()=>{if(index){index--;persist();quiz();}else home();};document.querySelector('#next').onclick=()=>{if(answers[index]===null)return;if(index<31){index++;persist();quiz();document.querySelector('.quiz h2').focus();}else showResult();};}
function score(values){return groups.map(([dim])=>{const total=questions.reduce((s,q,i)=>s+(q.dim===dim?values[i]*q.direction:0),0);return{dim,total,percent:Math.round((total+16)/32*100),letter:total===0?'?':dim[total>0?0:1]};});}
const names={INTJ:'独立的构想家',INTP:'好奇的解题者',ENTJ:'有方向的推动者',ENTP:'灵感的探索者',INFJ:'安静的洞察者',INFP:'温柔的理想家',ENFJ:'温暖的连接者',ENFP:'热情的追光者',ISTJ:'可靠的实践者',ISFJ:'细致的守护者',ESTJ:'有序的组织者',ESFJ:'贴心的联结者',ISTP:'灵活的行动派',ISFP:'自在的感受者',ESTP:'敏捷的体验家',ESFP:'鲜活的分享者'};
const labels=[['外向 E','内向 I'],['实感 S','直觉 N'],['思考 T','情感 F'],['判断 J','感知 P']];
function showResult(){if(count()!==32){index=answers.findIndex(x=>x===null);quiz();return;}const dims=score(answers),type=dims.map(d=>d.letter).join(''),balanced=dims.filter(d=>Math.abs(d.total)<=2).length;result={dims,type,title:names[type]||'保持开放的多面探索者'};const traits=dims.map((d,i)=>Math.abs(d.total)<=2?'保持弹性':[['向外连接','向内充电'],['关注具体','看见可能'],['分析利弊','重视价值'],['偏爱计划','拥抱变化']][i][d.total>0?0:1]);app.innerHTML=`<div class="result enter"><p class="eyebrow">A SNAPSHOT OF YOU, TODAY</p><div class="resulttop"><section class="resultcard"><span class="sticker">✳</span><p>此刻，你更接近</p><div class="type">${type}</div><h2>${result.title}</h2><p>你有自己的节奏，也有不断变化的可能。<br>让这张卡片成为认识自己的起点。</p><div class="chips">${[...new Set(traits)].map(t=>`<span class="chip">${t}</span>`).join('')}</div></section><section class="dimensions"><h2>你的四维偏好光谱</h2><p class="hint">色条表示本次问卷的回答倾向，不是能力或人格占比。</p>${dims.map((d,i)=>`<div class="dimension"><div class="dimlabels"><span>${labels[i][0]}</span><span>${labels[i][1]}</span></div><div class="dimbar"><i style="width:${d.percent}%"></i></div><div class="dimnote">${Math.abs(d.total)<=2?'接近中间 · 暂无明显偏向':`本次回答更偏向${labels[i][d.total>0?0:1]} · ${Math.abs(d.total)<=6?'倾向较轻':'倾向较明显'}`}</div></div>`).join('')}</section></div><div class="actions"><button class="button dark" id="download">保存性格卡片</button><button class="button" id="copy">复制分享文案</button><button class="textbtn" id="review">回看并修改答案</button><button class="textbtn" id="retake">重新探索</button></div><p class="resultnote">${balanced?`你有 ${balanced} 个维度接近中间，不必急着选定一个类型。`:'类型仅是本次回答的简写。'}“?”表示两侧得分完全相同。字母不决定能力、职业或关系，结果仅供自我探索。</p><h2 class="section-title">把了解，变成一点小行动。</h2><div class="advice"><section><h3>学习 · 找到舒服的节奏</h3><p>${dims[1].total>2?'先用具体例子建立理解，再试着总结规律。熟悉之后，也给自己留一点探索新方法的空间。':dims[1].total< -2?'先画出知识之间的联系，再用练习检查细节。灵感很重要，落地的小步骤也很有帮助。':'具体例子与整体框架可以交替使用，观察哪种方式更适合眼前这门课。'}</p></section><section><h3>沟通 · 让彼此更容易理解</h3><p>${dims[2].total>2?'分析问题前，先问一句“你希望我倾听还是一起找办法？”好的建议，也需要合适的时机。':dims[2].total< -2?'照顾感受的同时，清楚说出自己的需求。可以尝试“我在意的是……我希望我们……”这样的表达。':'不妨把事实、感受与期待分开说，让对方既能理解事情，也能理解你的立场。'}</p></section><section><h3>合作 · 为不同方式留空间</h3><p>${dims[3].total>2?'把计划和检查节点分享给伙伴，同时预留调整余地。大家未必以相同方式抵达终点。':dims[3].total< -2?'保留灵活性的同时，约定一个最小交付和时间点，让伙伴知道你会在何时带来什么。':'可以固定关键节点，把实现方法留得灵活一些，兼顾秩序与探索。'}</p></section></div><p class="resultnote">以上建议由本次回答按规则组合生成，并非经过验证的个体心理评估。答案仅保存在本机，可在“这是什么？”中清除。</p></div>`;document.querySelector('#download').onclick=download;document.querySelector('#copy').onclick=async()=>{const text=`我在 VIBE 人格实验室发现，此刻的我更接近 ${type} · ${result.title}。四个字母只是起点，我还有更多可能。`;try{await navigator.clipboard.writeText(text);notify('分享文案已复制');}catch{notify('浏览器未允许复制，可以保存卡片分享');}};document.querySelector('#review').onclick=()=>{index=0;quiz();};document.querySelector('#retake').onclick=()=>{if(confirm('重新开始会清除本机这次的答案，确定吗？')){answers.fill(null);index=0;persist();quiz();}};window.scrollTo({top:0,behavior:'smooth'});}
function download(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#c3b8f3';x.fillRect(0,0,1080,1350);x.fillStyle='#20221f';x.font='bold 75px sans-serif';x.fillText('vibe ✳',75,125);x.font='26px sans-serif';x.fillText('人格实验室 / PERSONALITY LAB',75,185);x.beginPath();x.moveTo(75,240);x.lineTo(1005,240);x.stroke();x.font='30px sans-serif';x.fillText('此刻，我更接近',75,340);x.font='bold 190px sans-serif';x.fillText(result.type,65,550);x.font='bold 49px sans-serif';x.fillText(result.title,75,660);x.font='30px sans-serif';x.fillText('你有自己的节奏，也有不断变化的可能。',75,755);result.dims.forEach((d,i)=>{const y=850+i*78;x.font='26px sans-serif';x.fillStyle='#20221f';x.fillText(labels[i][0],75,y);x.fillText(labels[i][1],865,y);x.fillStyle='#f6f6f0';x.fillRect(245,y-21,550,18);x.fillStyle='#384336';x.fillRect(245,y-21,550*d.percent/100,18);});x.fillStyle='#20221f';x.font='25px sans-serif';x.fillText('BE YOUR OWN KIND.  每一种个性都有光。',75,1225);x.font='21px sans-serif';x.fillText('原创性格探索 · 非官方MBTI测评 · 仅供自我了解',75,1280);c.toBlob(blob=>{if(!blob){notify('图片生成失败，请重试');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`VIBE-${result.type}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('卡片已生成，若未下载请检查浏览器下载设置');});}
document.querySelector('.logo').onclick=e=>{e.preventDefault();home();window.scrollTo(0,0);};document.querySelector('#about').onclick=()=>document.querySelector('#info').showModal();document.querySelector('.close').onclick=()=>document.querySelector('#info').close();document.querySelector('#clear').onclick=()=>{if(confirm('清除当前浏览器保存的全部答案？')){try{localStorage.removeItem(KEY);}catch{}answers.fill(null);index=0;result=null;document.querySelector('#info').close();home();notify('本机记录已清除');}};home();

</script></body></html>
